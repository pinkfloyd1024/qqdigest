# ==========================================================================
# qqdigest 配置模板
#
# 复制成 config.toml 后按自己的情况修改。
# config.toml / data/ / runs/ / logs/ 都在 .gitignore 里，不会被提交。
# ==========================================================================

# ============================================================================
# qqdigest 配置文件
# ----------------------------------------------------------------------------
# 所有路径均相对项目根目录解析；项目整体位于 D 盘。
# 修改后无需重新编译，重启程序即可生效。
# ============================================================================

[general]
# 时区。Asia/Shanghai 固定为 UTC+8（中国无夏令时）
timezone = "Asia/Shanghai"

# 干跑模式：true = 不向 QQ 发送任何消息，只写留档文件 + 复制到剪贴板 + 打印日志。
# ★ 强烈建议先用 true 跑一到两周，确认整合质量后再改为 false。
dry_run = true

# 每日发送时刻（24 小时制 HH:MM）
schedule = ["12:00", "18:00", "22:00"]

# 调度模式：
#   "explicit" = 用上面的 schedule 列表
#   "hourly"   = 工作时间内每个整点一次（下面的 work_hours_* 生效）
schedule_mode = "explicit"

# 工作时间（schedule_mode = "hourly" 时生效）：工作时间内每个整点压缩+发送
# 08:00~23:00 共 16 档
work_hours_start = "08:00"
work_hours_end = "23:00"

# 权重 >= 此值的会话不做每小时压缩，保留原文（高权重信息不压缩）
no_compress_weight = 8

# 是否在每次整合前，先把**低权重**会话逐群压缩存本地。
# 高权重会话（权重 >= no_compress_weight）永远保留原文，不压缩。
# 压缩结果存在 compressed_blocks 表，整合时低权重用摘要、高权重用原文。
compress_low_weight = true

# 提前多少分钟把消息交给本地模型整合，结果暂存，到点再发。
# 采集窗口的结束边界 = 预计算时刻（不是发送时刻），因此不会丢消息。
precompute_lead_min = 5

# 首次运行（数据库为空）时，向前回溯多少小时的消息
first_run_lookback_hours = 12

# 调度循环的检查间隔（秒）
poll_interval_sec = 15

# 程序启动时，若某个时间点已过去但尚未处理，超过该分钟数就跳过不补发
catch_up_max_min = 30

# 单次整合覆盖的最长时间跨度（小时）。程序长时间未运行后，避免一次吞下几天的消息
max_window_hours = 24

# 发送失败后的重试窗口（分钟）。窗口内每轮重试，超出则标记为最终失败
send_retry_window_min = 60


[onebot]
# 大号 QQ（数据来源）
self_id = "你的大号QQ"

# --- 事件上报：本程序作为服务端，NapCat 把消息事件 POST 到这里 ---
# NapCat 侧配置「HTTP 上报」地址为：http://127.0.0.1:5700/
report_host = "127.0.0.1"
report_port = 5700
report_path = "/"

# 校验 NapCat 上报请求的 token。留空 = 不校验（仅监听 127.0.0.1 时可接受）。
# 若填写，则同时接受 Authorization: Bearer <token> 与 ?token=<token> 两种形式。
report_token = ""

# --- API 调用：本程序作为客户端，调用 NapCat 的 OneBot HTTP 服务 ---
# NapCat 侧配置「HTTP 服务端」监听 127.0.0.1:3000
api_base = "http://127.0.0.1:3000"
api_token = ""
api_timeout_sec = 15


[target]
# 简报发往的账号（小号）。本机另一个 QQ 号，请自行确认。
send_to = "接收简报的小号QQ"

# 单条消息最大字数，超出自动分段发送
max_chars_per_message = 1500

# 分段之间的间隔（秒），降低触发频率风控的可能
send_gap_sec = 1.5


[llm]
base_url = "http://127.0.0.1:1234/v1"
model = "qwen/qwen3-14b"

# ★ 必须留够：思维链 token 与正文共享该上限。实测小于 2000 会出现"正文为空"。
max_tokens = 3000
# 归类任务希望稳定，温度不宜高
temperature = 0.2

# 输入上下文预算（token）。超出则按会话分块做 map-reduce。
# 参考：本机 ctx 16384，输出 3000，模板约 300 → 13000 是安全值。
input_budget_tokens = 13000

# true = 在用户消息前加 /no_think，关闭思维链（实测提速约一倍且本任务质量不降）
# false = 保留思维链，此时建议把 max_tokens 提到 4000 以上
no_think = true

timeout_sec = 600
max_retries = 1


[filter]
# 采集范围
collect_private = true
collect_group = true

# collect_group = true 时生效；留空 = 采集全部群
group_whitelist = []

# true = 只整合"收到的"消息；false = 连自己发出的也一起整合
only_incoming = false

# 自动剔除无信息量内容：
#   整条只有 [图片]/[表情]/纯语气词 -> 整条丢弃
#   混有文字的 -> 占位符压缩成紧凑写法（[图片] -> [图]）
strip_placeholders = true

# 永不采集的会话（好友 QQ 号或群号，字符串）
peer_blacklist = []


[important]
# 重要消息规则：命中的消息会被标记，并在简报中被优先提示。
# 命中条件（满足任一即可）：
#   1. 消息正文包含 keywords 中的任意一个词
#   2. 会话对象（好友 QQ 号 / 群号）在 peers 列表中
# 建议填写真正会让你漏事的人或词，例如老板、家人、金额相关的词。
keywords = []
peers = []

# 命中后消息前加的标记（简报里也会用到）
mark_prefix = "⭐"

# 命中后是否立即弹窗提醒（不等定时简报）
notify_immediately = false
notify_toast = true
notify_clipboard = true


[prompt]
# 提示词覆盖。留空 = 使用程序内置的默认提示词（推荐先用默认跑一段时间）。
# 内置默认见 qqdigest/prompts.py；界面上有「恢复默认」按钮可以查看并还原。
#
# 多行文本建议用三单引号（字面量，不做转义），例如：
#   system_prompt = '''
#   你的自定义提示词……
#   '''

system_prompt = ""

# 分块摘要（消息量很大时才用到）的提示词
map_system_prompt = ""

# 追加规则：会拼接到最终系统提示词的末尾，适合加个人偏好，
# 例如「不要给我总结股票群」「金额一律用「元」标注」
extra_rules = ""


[storage]
data_dir = "data"
runs_dir = "runs"
logs_dir = "logs"

# 留档文件保留天数，0 = 永久保留
runs_keep_days = 180

# 定时发送成功后，是否删除该时段已投递的消息。
# 注意：只按"该时段的时间窗口"删除，窗口外（刚到的）消息不会动；
# 手动点「立即整合并发送」永远不删数据。
delete_after_scheduled_send = false

# 权重 0（静音）消息的保留天数，0 = 永久保留。
# 用它代替"权重 0 干脆不入库"——模型分类会错判，直接丢弃就找不回来了。
muted_keep_days = 7

# 干跑模式下是否把简报复制到剪贴板
clipboard_on_dry_run = true


[tags]
# ==========================================================================
# 会话标签与权重：给每个群打一个固定标签，按权重从高到低依次整合。
#
# 目的：解决"信号稀释"——实测 30 条游戏群闲聊会把 2 条真正要办的私聊淹掉。
# 权重高的会话排在前面，权重 0 的直接不进入上下文（只统计条数）。
#
# 判定优先级（从高到低）：manual 手工指定 > keywords 关键词 > 本地模型分类
#
# ⚠️ TOML 注意：下面这些标量键必须写在 [tags.weights] 之类的子表**之前**，
#    否则它们会被归到子表里去。
# ==========================================================================
enabled = true

# 用本地模型自动识别（会带几条采样消息一起判断，比只看群名准得多）
auto_classify = true

# 固定标签集：模型只能从这里选，保证标签可控、数量有限
labels = ["课程", "工作", "学校", "家人", "技术", "同学", "聊天群", "营销"]

# 未识别出来的会话落到这个标签
default_label = "聊天群"

# 私聊的权重（私聊默认最重要，100 高于所有群标签）
private_weight = 100

# 分类时是否附带采样消息内容
use_sample_messages = true
sample_count = 12

# 权重 0 的会话是否排除出整合
exclude_weight_zero = true

# 单次分类调用的超时（秒）
classify_timeout_sec = 90


# 标签 -> 权重。数值越大越优先整合；0 = 完全不纳入整合（只统计条数）
# 顺序就是整合顺序：先 工作/课程，最后 聊天群，营销直接不要
#
# ⚠️ TOML 的裸键只允许 A-Za-z0-9_- ，中文键**必须加双引号**，否则解析报错。
[tags.weights]
"课程" = 10
"工作" = 10
"家人" = 9
"学校" = 8
"技术" = 6
"同学" = 4
"聊天群" = 1
"营销" = 0


# 关键词规则：命中群名/会话名就直接定标签，不调用模型（更快也更可控）
# 建议把你自己群里那些一眼能认出来的词写进来
[tags.keywords]
"课程" = ["课程", "作业", "实验", "课设", "老师", "助教"]
"学校" = ["学院", "大学", "新生", "级", "班", "教务处", "辅导员"]
"工作" = ["项目", "需求", "会议", "部门", "周报", "上线", "排期", "客户"]
"技术" = ["技术", "开发", "编程", "开源", "算法", "ACM", "ICPC", "刷题"]
"营销" = ["优惠", "推广", "代购", "秒杀", "拼单", "返利", "广告"]


# 手工指定：群号/QQ号 -> 标签。优先级最高，永远覆盖模型判断
#
# 实测教训：模型即使看了采样消息也会判错。例如「示例会话35」是个游戏群
# （692 条消息、占总量 38%），模型因为群里聊硬件配置把它判成了"技术"（权重 6），
# 而它本该待在最底层。**你比模型清楚哪个群是什么——这一节就是给你纠错用的。**
#
# 界面「群标签」页双击任意一行也能改，效果等价（存在数据库的 peer_tags 表里）。
[tags.manual]
"10000229" = "聊天群"   # 示例会话35（游戏群，不该占上下文预算）
